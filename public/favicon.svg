<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="prepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="48" height="48" rx="13" fill="url(#prepGrad)" />
  <rect x="1" y="1" width="46" height="46" rx="12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />

  <!-- Compass / Navigation Pilot Rose -->
  <g filter="url(#shadow)">
    <!-- Outer Ring -->
    <circle cx="24" cy="24" r="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" />
    
    <!-- Minor Cardinal Markers -->
    <circle cx="24" cy="10" r="1.2" fill="#ffffff" />
    <circle cx="38" cy="24" r="1.2" fill="#ffffff" />
    <circle cx="24" cy="38" r="1.2" fill="#ffffff" />
    <circle cx="10" cy="24" r="1.2" fill="#ffffff" />
    
    <!-- North-East Pilot Compass Needle Pointer -->
    <!-- Top-Right Pointing Needle (Active / White) -->
    <polygon points="24,24 33.5,14.5 25.5,22.5" fill="url(#needleGrad)" />
    <polygon points="24,24 33.5,14.5 22.5,25.5" fill="#c7d2fe" />
    
    <!-- Bottom-Left Pointing Needle (Counterbalance / Indigo) -->
    <polygon points="24,24 14.5,33.5 22.5,25.5" fill="#1e1b4b" opacity="0.65" />
    <polygon points="24,24 14.5,33.5 25.5,22.5" fill="#312e81" opacity="0.85" />
    
    <!-- Center Pivot Jewel -->
    <circle cx="24" cy="24" r="2.8" fill="#ffffff" />
    <circle cx="24" cy="24" r="1.2" fill="#2563eb" />
  </g>
</svg>